{% load ui %}<div class="toasts" role="status" aria-live="polite">
  {% for message in messages %}
  <div class="toast {{ message.tags }}" data-toast>
    {% if message.level_tag == "error" %}{% icon "alert" %}{% elif message.level_tag == "success" %}{% icon "check" %}{% else %}{% icon "info" %}{% endif %}
    <span>{{ message }}</span>
    <button type="button" data-dismiss aria-label="Yopish">&times;</button>
  </div>
  {% endfor %}
</div>
