{% load ui %}{# rows: [{criterion, points, max, percent}]; size: "" | "sm"; animate: bool #}
<div class="puls{% if size == 'sm' %} puls-sm{% endif %}{% if animate %} puls-animate{% endif %}" data-puls>
  <div class="puls-track" role="img" aria-label="{{ label|default:'Mezonlar bo‘yicha ball taqsimoti' }}">
    {% for r in rows %}
    <span class="puls-seg{% if r.criterion.input_mode == 'auto' %} is-auto{% endif %}{% if r.percent == '100.0' %} is-full{% endif %}"
          style="flex: {{ r.max }} 1 0; --fill: {{ r.percent }}%; --i: {{ forloop.counter0 }}"
          {% if size != 'sm' %}tabindex="0"{% endif %}
          data-tip="{{ r.criterion.short_title }}: {{ r.points|points }} / {{ r.max }}"><i class="fill"></i></span>
    {% endfor %}
  </div>
  {% if legend %}
  <div class="puls-legend" aria-hidden="true">
    {% for r in rows %}<span style="flex: {{ r.max }} 1 0">{{ r.max }}</span>{% endfor %}
  </div>
  {% endif %}
</div>
