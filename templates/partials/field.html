{% load ui %}<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if field.field.widget.input_type == "password" %}
  <div class="password-wrap">
    {{ field }}
    <button type="button" class="toggle-pass" data-toggle-pass aria-label="Parolni ko'rsatish" aria-pressed="false">{% icon "eye" %}</button>
  </div>
  {% else %}{{ field }}{% endif %}
  {% if field.help_text %}<span class="hint" id="{{ field.id_for_label }}-hint">{{ field.help_text }}</span>{% endif %}
  {% for e in field.errors %}<span class="error" id="{{ field.id_for_label }}-error">{{ e }}</span>{% endfor %}
</div>
