{% load static %}<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ site.system_name }}{% endblock %} | {{ site.university_short }}</title>
  <link rel="icon" href="{% static 'img/mark.svg' %}" type="image/svg+xml">
  <link rel="preload" href="{% static 'fonts/outfit-latin-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/theme.js' %}"></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Asosiy mazmunga o'tish</a>
  {% block body %}{% endblock %}
  {% include "partials/toasts.html" %}
  <script src="{% static 'js/app.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
