# /etc/nginx/sites-available/socialpuls  (keyin: ln -s ../sites-available/socialpuls /etc/nginx/sites-enabled/)
upstream socialpuls {
    server unix:/run/socialpuls/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name puls.namdu.uz;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.25.1+ da "listen 443 ssl;" va alohida "http2 on;" yozish mumkin.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name puls.namdu.uz;

    ssl_certificate     /etc/letsencrypt/live/puls.namdu.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/puls.namdu.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 5 ta fayl x 10 MB + forma maydonlari
    client_max_body_size 60m;
    server_tokens off;

    access_log /var/log/nginx/socialpuls.access.log;
    error_log  /var/log/nginx/socialpuls.error.log;

    # Statik fayllar (collectstatic natijasi). Whitenoise ham beradi, lekin nginx tezroq.
    location /static/ {
        alias /srv/socialpuls/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Yutuq hujjatlari: faqat Django ruxsat berganda X-Accel-Redirect orqali beriladi, to'g'ridan-to'g'ri ochilmaydi.
    location /protected/ {
        internal;
        alias /var/lib/socialpuls/private_media/;
    }

    # Ochiq papka yo'q: yuklangan fayllar faqat /fayl/<id>/ orqali.
    location /media/ { return 404; }

    location / {
        proxy_pass http://socialpuls;
        proxy_set_header Host $host;
        # Ilova mijoz IP sini faqat X-Real-IP dan oladi: nginx uni har doim qayta yozadi.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 130s;
    }
}
